name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore PCM_Backend/PCM.API.Tests/PCM.API.Tests.csproj
      - run: dotnet test PCM_Backend/PCM.API.Tests/PCM.API.Tests.csproj --configuration Release --no-restore

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PCM_Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Keep legacy lint warnings visible without blocking backend/mobile tests.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
